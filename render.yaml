services:
  # Spring Boot Backend Web Service
  - type: web
    name: smart-expense-backend
    runtime: java
    rootDir: backend
    buildCommand: chmod +x mvnw && ./mvnw clean package -DskipTests
    startCommand: java -jar target/smart-expense-tracker-1.0.0.jar --spring.profiles.active=h2
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: JWT_SECRET
        generateValue: true

  # React Frontend Static Site
  - type: web
    name: smart-expense-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
