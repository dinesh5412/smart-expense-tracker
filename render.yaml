services:
  # Spring Boot Backend Web Service
  - type: web
    name: smart-expense-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: JWT_SECRET
        generateValue: true

  # React Frontend Static Site
  - type: web
    name: smart-expense-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: /api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
