version: '3.8'

services:
  # Spring Boot 3 Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-expense-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=h2
      - JWT_SECRET=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/auth/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - expense-network

  # React 18 + Nginx Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-expense-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - expense-network

networks:
  expense-network:
    driver: bridge
